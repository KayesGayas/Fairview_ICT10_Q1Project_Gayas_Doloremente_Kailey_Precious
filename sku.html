<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module"src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <title>SKU Generator</title>

</head>
<body>

    <style>

        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode',
                'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

            background-image: url("https://i.pinimg.com/736x/10/86/14/108614008a12928220759c5d083c2afb.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
        }


        .navbar {
            background-color: rgb(162, 62, 62);
            display: flex;
            padding: 15px;
        
        }

        .navbar a {
            color: rgb(250, 250, 250);
            text-decoration: none;
        }

        .nav-links {
            margin-left: auto;
            display: flex;
            gap: 25px;
        }

        h1 {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.93);
            color: rgb(98, 46, 46);
            width: 300px;
            margin: 35px auto;
            padding: 10px;
            border-radius: 20px;
        }


        form {
            text-align: left;
            width: 250px;
            margin: 10px auto;
            padding: 35px 60px;
            border-radius: 15px;
            font-size: 18px;
            background-color: rgba(253, 255, 237, 0.95);
        }


        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: rgb(73, 34, 34);
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 8px;
            font-family: inherit;
        }

        button {
            display: block;
            margin: 20px auto;
            color: white;
            background-color: rgb(98, 49, 46);
            border: none;
            border-radius: 8px;
            width: 150px;
            height: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(73, 42, 34);
        }
        #sku {
            text-align: center;
            background-color: rgba(220, 232, 216, 0.95);
            width: 250px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 10px;
            color: rgb(98, 46, 46);
            font-size: 20px;
            font-weight: bold;
        }
    
        footer {
         text-align: center;
         color: white;
         background-color: rgb(162, 62, 62);
         padding: 15px;
         margin-top: 30px;
        font-weight: bold;
       }

    </style>

    <ul class="navbar">

        <a href="index.html">Buldak Corner 🍜</a>
        <ul class="nav-links">
            <a href="index.html">Receipt</a>
            <a href="sku.html">SKU Generator</a>
        </ul>
    </ul>

    <br>

    <h1>SKU Generator</h1>
    <form>

        <label for="category">
            Product Category
        </label>
        <select id="category">
            <option value="">
                Select a category
            </option>
            <option value="Buldak">
                Buldak
            </option>
            <option value="Desserts">
                Desserts
            </option>
            <option value="Drinks">
                Drinks
            </option>

        </select>

        <label for="product">
            Product Name
        </label>

        <input
            type="text"
            id="product"
            placeholder="Example: Carbonara"
        >

        <label for="stock">
            Stock Quantity
        </label>
        <input
            type="number"
            id="stock"
            placeholder="Example: 25"
        >

    </form>

    <button py-click="generate_sku">
        Generate SKU
    </button>

    <div id="sku">
        ---
    </div>

    <footer>
       Made by Kailey Gayas & Precious Dolormente
    </footer>  

    <py-script src="main.py"></py-script>

</body>
</html> 

    <py-script src="main.py"></py-script>

</body>
</html>
